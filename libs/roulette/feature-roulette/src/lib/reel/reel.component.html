<figure class="reel" [class.spinning]="mode() === 'spinning'" [class.landed]="mode() === 'landed'">
  <div class="window" role="img" [attr.aria-label]="caption()">
    @if (mode() === 'idle') {
      <!-- The possible outcomes, scrolling slowly. -->
      <div
        class="strip idle"
        [class.moving]="idle().moving && !paused()"
        [style.--loop-distance]="idle().distance"
        [style.--loop-duration]="idle().duration"
      >
        @for (row of idle().rows; track $index) {
          <div class="slot" [class.with-thumb]="!!row.thumb">
            <ng-container *ngTemplateOutlet="content; context: { $implicit: row }" />
          </div>
        }
      </div>
    } @else {
      <div #strip class="strip">
        @for (row of rows(); track $index) {
          <div class="slot" [class.with-thumb]="!!row.thumb" [class.winner]="isWinner($index)">
            @if (isWinner($index) && row.backdrop) {
              <img class="backdrop" [src]="row.backdrop" alt="" decoding="async" (error)="hideImage($event)" />
            }
            <ng-container *ngTemplateOutlet="content; context: { $implicit: row }" />
          </div>
        }
      </div>
    }
    <div class="frame"></div>
  </div>
  <figcaption class="xiv-label">{{ caption() }}</figcaption>
</figure>

<!-- A slot's content. Images have fixed sizes, so loading them never shifts the rows. -->
<ng-template #content let-row>
  @if (row.thumb) {
    <img class="thumb" [src]="row.thumb" alt="" width="28" height="28" decoding="async" (error)="hideImage($event)" />
  }
  <span class="text">
    <span class="title"
      >{{ row.title }}
      @if (row.icon) {
        <img class="icon" [src]="row.icon" alt="" width="24" height="24" decoding="async" (error)="hideImage($event)" />
      }
    </span>
    @if (row.detail) {
      <span class="detail">{{ row.detail }}</span>
    }
  </span>
</ng-template>
