<figure class="wheel" [class.spinning]="spinning()">
  <svg viewBox="-120 -120 240 240" role="img" [attr.aria-label]="caption()">
    <defs>
      <radialGradient id="wheel-gold" cx="35%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#fff3c4" />
        <stop offset="45%" stop-color="#d9b25f" />
        <stop offset="100%" stop-color="#7a5a1e" />
      </radialGradient>
      <linearGradient id="wheel-crystal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e6fbff" />
        <stop offset="55%" stop-color="#5cc8ff" />
        <stop offset="100%" stop-color="#1b5fa8" />
      </linearGradient>
    </defs>

    <circle class="rim" r="114" />
    @for (light of lights; track $index) {
      <circle class="light" [class.odd]="$odd" [attr.cx]="light.x" [attr.cy]="light.y" r="2.6" />
    }

    <g #rotor class="rotor">
      @for (segment of paths(); track $index) {
        <g class="segment" [class.alt]="$odd" [class.won]="winner() === $index">
          @if (segment.path) {
            <path [attr.d]="segment.path" />
          } @else {
            <circle [attr.r]="radius" />
          }
          <text [attr.transform]="segment.labelTransform" [attr.font-size]="fontSize()">{{ segment.label }}</text>
        </g>
      }
    </g>

    <circle class="hub" r="17" />
    <polygon class="crystal" points="0,-12 7,-2 0,12 -7,-2" />
    <polygon class="pointer" points="-9,-121 9,-121 0,-99" />
  </svg>
  <figcaption>{{ caption() }}</figcaption>
</figure>
