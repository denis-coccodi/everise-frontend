<figure class="wheel" [class.spinning]="spinning()">
  <svg viewBox="-120 -120 240 240" role="img" [attr.aria-label]="caption()">
    <defs>
      <radialGradient [attr.id]="goldId" cx="35%" cy="30%" r="80%">
        <stop offset="0%" class="stop-gold-bright" />
        <stop offset="45%" class="stop-gold" />
        <stop offset="100%" class="stop-gold-deep" />
      </radialGradient>
      <linearGradient [attr.id]="crystalId" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" class="stop-crystal-bright" />
        <stop offset="55%" class="stop-crystal" />
        <stop offset="100%" class="stop-crystal-deep" />
      </linearGradient>
    </defs>

    <circle class="rim" r="114" [attr.stroke]="goldFill" />
    @for (light of lights; track $index) {
      <circle class="light" [class.odd]="$odd" [attr.cx]="light.x" [attr.cy]="light.y" r="2.6" />
    }

    <g #rotor class="rotor">
      @for (segment of paths(); track $index) {
        <g class="segment" [class.alt]="$odd" [class.won]="winner() === $index">
          @if (segment.path) {
            <path [attr.d]="segment.path" />
          } @else {
            <circle [attr.r]="radius" />
          }
          <text [attr.transform]="segment.labelTransform" [attr.font-size]="fontSize()">{{ segment.label }}</text>
        </g>
      }
    </g>

    <circle class="hub" r="17" [attr.fill]="goldFill" />
    <polygon class="crystal" points="0,-12 7,-2 0,12 -7,-2" [attr.fill]="crystalFill" />
    <polygon class="pointer" points="-9,-121 9,-121 0,-99" [attr.fill]="goldFill" />
  </svg>
  <figcaption class="xiv-label">{{ caption() }}</figcaption>
</figure>
