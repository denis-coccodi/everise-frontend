<figure class="wheel" [class.spinning]="spinning()">
  <svg viewBox="-120 -120 240 240" role="img" [attr.aria-label]="caption()">
    <defs>
      <linearGradient [attr.id]="crystalId" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" class="stop-crystal-bright" />
        <stop offset="55%" class="stop-crystal" />
        <stop offset="100%" class="stop-crystal-deep" />
      </linearGradient>
    </defs>

    <circle class="rim" r="113" />
    <circle class="rim-inner" r="101" />
    @for (tick of ticks; track $index) {
      <line
        class="tick"
        [class.major]="tick.major"
        [attr.x1]="tick.x1"
        [attr.y1]="tick.y1"
        [attr.x2]="tick.x2"
        [attr.y2]="tick.y2"
      />
    }

    <g #rotor class="rotor">
      @for (segment of paths(); track $index) {
        <g class="segment" [class.alt]="$odd" [class.won]="winner() === $index">
          @if (segment.path) {
            <path [attr.d]="segment.path" />
          } @else {
            <circle [attr.r]="radius" />
          }
          <text [attr.transform]="segment.labelTransform" [attr.font-size]="fontSize()">{{ segment.label }}</text>
        </g>
      }
    </g>

    <circle class="hub" r="18" />
    <circle class="hub-ring" r="14" />
    <polygon class="crystal" points="0,-13 7.5,-2 0,13 -7.5,-2" [attr.fill]="crystalFill" />
    <!-- The pointer: a crystal shard pointing at the winning segment. -->
    <polygon class="pointer" points="0,-98 -7,-112 0,-122 7,-112" [attr.fill]="crystalFill" />
  </svg>
  <figcaption class="xiv-label">{{ caption() }}</figcaption>
</figure>
