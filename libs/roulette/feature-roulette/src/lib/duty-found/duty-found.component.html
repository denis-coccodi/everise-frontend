<cdt-dialog heading="Duty Found" (dismissed)="commence.emit()">
  <p class="type xiv-label">{{ result().type }}</p>
  <p class="name">{{ result().name }}</p>
  @if (result().dutyUnknown) {
    <p class="unknown" aria-label="Duty chosen by the game">? ? ?</p>
  }
  <p class="detail">{{ result().detail }}</p>

  <dl>
    <dt class="xiv-label">Party settings</dt>
    <dd>{{ result().mode }}</dd>
  </dl>

  <div class="timer" aria-hidden="true"><span></span></div>

  <div class="actions">
    <button #commenceButton type="button" cdtButton (click)="commence.emit()">Commence</button>
    <button type="button" cdtButton="secondary" (click)="withdraw.emit()">Withdraw</button>
  </div>
</cdt-dialog>
