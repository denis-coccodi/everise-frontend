<div class="backdrop" (click)="commence.emit()"></div>
<section
  class="window"
  role="dialog"
  aria-modal="true"
  aria-labelledby="duty-found-title"
  (keydown.escape)="commence.emit()"
>
  <h2 id="duty-found-title" class="xiv-title-bar">Duty Found</h2>

  <p class="type xiv-label">{{ result().type }}</p>
  <p class="name">{{ result().name }}</p>
  @if (result().dutyUnknown) {
    <p class="unknown" aria-label="Duty chosen by the game">? ? ?</p>
  }
  <p class="detail">{{ result().detail }}</p>

  <dl>
    <dt class="xiv-label">Party settings</dt>
    <dd>{{ result().mode }}</dd>
  </dl>

  <div class="timer" aria-hidden="true"><span></span></div>

  <div class="actions">
    <button #commenceButton type="button" class="btn btn-primary" (click)="commence.emit()">Commence</button>
    <button type="button" class="btn btn-secondary" (click)="withdraw.emit()">Withdraw</button>
  </div>
</section>
