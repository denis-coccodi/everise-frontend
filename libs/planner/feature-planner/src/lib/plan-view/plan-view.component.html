@if (replanned() && openers().length) {
  <cdt-field label="Opener" for="planner-opener" [hint]="openerHint()">
    <select #opening id="planner-opener" cdtInput class="opener" (change)="setOpener(opening.value)">
      @for (o of openers(); track o.id) {
        <option [value]="o.id" [selected]="opener() === o.id">
          {{ o.name === 'Standard' ? 'Use standard opener' : o.name }}
        </option>
      }
    </select>
  </cdt-field>
}
@if (replanned() && player().role === 'healer') {
  <cdt-field
    label="Favour"
    for="planner-favour"
    hint="Damage: a white mage spends the third lily as it comes in, for Afflatus Misery, and GCD heals go only where nothing else will do. Healing: no lily spent for damage, and GCD heals count for more."
  >
    <select #favouring id="planner-favour" cdtInput class="favour" (change)="setFavour(favouring.value)">
      <option value="dps" [selected]="favour() === 'dps'">Damage</option>
      <option value="healing" [selected]="favour() === 'healing'">Healing</option>
    </select>
  </cdt-field>
}
@if (replanned() && invulnerabilities().length) {
  <fieldset class="invulnerabilities">
    <legend>Invulnerabilities</legend>
    @for (row of invulnerabilities(); track row.key) {
      <cdt-field
        [label]="row.name"
        [for]="'planner-invulnerability-' + row.key"
        hint="Where the group uses it, as in the pull by default: a mechanic one tank takes alone, or makes simpler. Only if needed: where nothing else saves a hit."
      >
        <select
          #choice
          cdtInput
          [id]="'planner-invulnerability-' + row.key"
          (change)="setInvulnerability(row, choice.value)"
        >
          <option value="planner" [selected]="row.setting === 'planner'">Only if needed</option>
          <option value="never" [selected]="row.setting === 'never'">Never</option>
          @for (m of mechanics(); track m.id) {
            <option [value]="m.id" [selected]="row.setting === m.id">{{ clock(m.at) }} {{ m.name }}</option>
          }
        </select>
      </cdt-field>
    }
  </fieldset>
}
<cdt-message [tone]="unplaced() ? 'warning' : 'status'">{{ summary() }} {{ unplaced() }}</cdt-message>
