<cdt-panel [heading]="heading()">
  @if (store.pull.hasValue() && store.catalog.hasValue()) {
    <cdt-planner-plan-form />
    <section class="hp" aria-labelledby="planner-hp-heading">
      <h3 id="planner-hp-heading" class="hp-heading">HP over the pull</h3>
      <cdt-planner-hp-chart [curves]="curves()" [durationMs]="store.pull.value().durationMs" [margin]="chartMargin()" />
    </section>
    <ul cdtTabs aria-label="Players" class="players">
      @for (p of players(); track p.id) {
        <li class="player">
          <cdt-checkbox
            class="replan"
            [checked]="plans.replan().includes(p.id)"
            (checkedChange)="plans.setReplanned(p.id, $event)"
            ><span class="visually-hidden">Replan {{ p.name }}</span></cdt-checkbox
          >
          <button type="button" cdtTab [active]="player()?.id === p.id" (click)="choose(p.id)">
            {{ p.job ?? 'Unknown job' }} {{ p.name }}
          </button>
        </li>
      }
    </ul>
    <ul cdtTabs aria-label="View" class="views">
      <li>
        <button type="button" cdtTab [active]="view() === 'played'" (click)="view.set('played')">As played</button>
      </li>
      <li><button type="button" cdtTab [active]="view() === 'plan'" (click)="view.set('plan')">Plan</button></li>
    </ul>
    @if (player(); as p) {
      <h3 class="visually-hidden">{{ p.name }}'s pull{{ planned() ? ' and plan' : '' }}</h3>
      <cdt-planner-plan-view [player]="p" [class.shown]="view() === 'plan'" />
      <cdt-planner-pull-compare [player]="p.name" [played]="log()" [planned]="planned()" [shown]="view()" />
    }
  } @else if (loading()) {
    <p class="loading">Reading the pull…</p>
  }
  <cdt-message tone="error">{{ error() }}</cdt-message>
</cdt-panel>
