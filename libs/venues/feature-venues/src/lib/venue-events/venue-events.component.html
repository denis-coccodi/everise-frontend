@if (shown().length) {
  <section aria-labelledby="venue-events">
    <h2 id="venue-events"><cdt-icon name="calendar" />Upcoming events here</h2>
    <p class="hint">{{ count() }} this week, from Partake. Times are in your time zone.</p>
    <ul>
      @for (event of shown(); track event.id) {
        <li><cdt-event-card [event]="event" [now]="now()" [compact]="true" /></li>
      }
    </ul>
  </section>
}
