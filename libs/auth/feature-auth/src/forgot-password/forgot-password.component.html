<div class="auth-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-6 offset-md-3 col-xs-12">
        <h1 class="text-xs-center">Forgot your password?</h1>
        <p class="text-xs-center">
          <a routerLink="/login">Back to sign in</a>
        </p>
        <p>Enter your account's email address. We'll send you a code to choose a new password with.</p>

        <cdt-list-errors></cdt-list-errors>

        <form [formRoot]="form">
          <cdt-field label="Email" for="email" required>
            <input
              [formField]="form.email"
              type="email"
              id="email"
              autocomplete="username"
              placeholder="Email"
              cdtInput="lg"
            />
            <cdt-input-errors [field]="form.email"></cdt-input-errors>
          </cdt-field>
          <cdt-turnstile action="forgot-password" (token)="turnstileToken.set($event)" />
          <button
            data-testid="send-code"
            cdtButton
            size="lg"
            class="pull-xs-right"
            [disabled]="form().invalid() || form().pending() || waitingForCheck() || store.busy()"
            type="submit"
          >
            Email me a code
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
