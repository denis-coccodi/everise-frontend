<div class="auth-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-6 offset-md-3 col-xs-12">
        <h1 class="text-xs-center">Sign in</h1>
        <p class="text-xs-center">
          <a [routerLink]="['/register']">Need an account?</a>
        </p>

        @if (fromDiscord) {
          <cdt-message class="from-discord">
            That was shared in the Everise Discord, for members: sign in to see it.
          </cdt-message>
        }

        <cdt-list-errors></cdt-list-errors>

        @if (unconfirmed(); as email) {
          <cdt-check-email [email]="email" />
        }

        <cdt-social-sign-in />

        <form [formRoot]="form">
          <cdt-field label="Email" for="email" required>
            <input
              [formField]="form.email"
              type="email"
              id="email"
              autocomplete="email"
              placeholder="Email"
              cdtInput="lg"
            />
            <cdt-input-errors [field]="form.email"></cdt-input-errors>
          </cdt-field>
          <cdt-field label="Password" for="password" required>
            <input
              [formField]="form.password"
              type="password"
              id="password"
              autocomplete="current-password"
              placeholder="Password"
              cdtInput="lg"
            />
            <cdt-input-errors [field]="form.password"></cdt-input-errors>
          </cdt-field>
          <p>
            <a routerLink="/forgot-password">Forgot your password?</a>
          </p>
          <cdt-turnstile action="login" (token)="turnstileToken.set($event)" />
          <button
            data-testid="sign-in"
            cdtButton
            size="lg"
            class="pull-xs-right"
            [disabled]="form().invalid() || form().pending() || waitingForCheck()"
            type="submit"
          >
            Sign in
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
