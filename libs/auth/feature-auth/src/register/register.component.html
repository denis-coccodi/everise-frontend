<div class="auth-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-6 offset-md-3 col-xs-12">
        <h1 class="text-xs-center">Sign up</h1>
        <p class="text-xs-center">
          <a [routerLink]="['/login']">Have an account?</a>
        </p>

        <cdt-list-errors></cdt-list-errors>

        @if (linkSentTo(); as email) {
          <cdt-check-email [email]="email" />
        } @else {
          <cdt-social-sign-in />

          <form [formRoot]="form">
            <cdt-field label="Username" for="username" required>
              <input
                [formField]="form.username"
                type="text"
                id="username"
                autocomplete="nickname"
                placeholder="Username"
                cdtInput="lg"
              />
              <cdt-input-errors [field]="form.username" />
            </cdt-field>
            <cdt-field label="Email" for="email" required>
              <input
                [formField]="form.email"
                type="email"
                id="email"
                autocomplete="username"
                placeholder="Email"
                cdtInput="lg"
              />
              <cdt-input-errors [field]="form.email" />
            </cdt-field>
            <cdt-field label="Password" for="password" required>
              <input
                [formField]="form.password"
                type="password"
                id="password"
                autocomplete="new-password"
                placeholder="Password"
                cdtInput="lg"
              />
              <cdt-input-errors [field]="form.password" />
            </cdt-field>
            <cdt-turnstile action="signup" (token)="turnstileToken.set($event)" />
            <button
              data-testid="sign-up"
              cdtButton
              size="lg"
              class="pull-xs-right"
              [disabled]="form().invalid() || form().pending() || waitingForCheck()"
              type="submit"
            >
              Sign up
            </button>
          </form>
        }
      </div>
    </div>
  </div>
</div>
