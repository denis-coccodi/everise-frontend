<cdt-field label="Search GIFs" for="gif-search">
  <input
    #searchInput="cdtInput"
    id="gif-search"
    type="search"
    cdtInput
    autocomplete="off"
    placeholder="Moogle, Tonberry, victory…"
    [value]="query()"
    (input)="search(searchInput.value)"
  />
</cdt-field>
<p class="visually-hidden" role="status">
  {{ searching() ? 'Searching…' : gifs().length + ' GIFs' }}
</p>
<ul class="gifs">
  @for (gif of gifs(); track gif.id) {
    <li>
      <button type="button" class="gif" (click)="picked.emit(gif)">
        <img [src]="gif.previewUrl" [alt]="gif.title" loading="lazy" />
      </button>
    </li>
  }
</ul>
@if (next() !== null) {
  <button type="button" cdtButton="outline-secondary" size="sm" [disabled]="searching()" (click)="more()">
    More GIFs
  </button>
}
<cdt-message class="error" tone="error">{{ error() }}</cdt-message>
<p class="attribution">Powered by GIPHY</p>
