<div class="home-page">
  <cdt-banner>
    <h1 class="logo-font">everise</h1>
    <p>A place to share your knowledge.</p>
  </cdt-banner>

  <div class="container page">
    <div class="row">
      <div class="col-md-9">
        <div class="feed-toggle">
          @if ({ listConfig: $listConfig() }; as model) {
            <ul cdtTabs>
              <li>
                <a cdtTab [active]="model.listConfig.type === 'FEED'" (click)="setListTo('FEED')">Your Feed</a>
              </li>
              <li>
                <a
                  cdtTab
                  data-testid="global-feed"
                  [active]="model.listConfig.type === 'ALL' && !model.listConfig.filters.tag"
                  (click)="setListTo('ALL')"
                  >Global Feed</a
                >
              </li>
              <li [hidden]="!model.listConfig.filters.tag">
                <a cdtTab [active]="true">
                  <i class="ion-pound"></i>
                  {{ model.listConfig.filters.tag }}
                </a>
              </li>
            </ul>
          }
        </div>

        <cdt-article-list></cdt-article-list>
      </div>

      <div class="col-md-3">
        @defer (when !!$tags().length) {
          <div class="sidebar">
            <cdt-tags-list (setListTag)="setListTag($event)" [tags]="$tags()"></cdt-tags-list>
          </div>
        }
      </div>
    </div>
  </div>
</div>
