<div class="home-page">
  <cdt-banner>
    <h1 class="logo-font">
      <img class="crest" src="assets/images/everise-crest.png" alt="" width="64" height="64" />everise
    </h1>
    <p>A laid-back, friendly free company. Everyone is welcome.</p>
    <cdt-community-links look="buttons" />
  </cdt-banner>

  <div class="container page">
    <div class="row">
      <div class="col-md-9">
        <div class="feed-toggle">
          <h2 class="visually-hidden">Posts</h2>
          @if ({ listConfig: $listConfig() }; as model) {
            <ul cdtTabs>
              <li>
                <button
                  type="button"
                  cdtTab
                  data-testid="global-feed"
                  [active]="model.listConfig.type === 'ALL' && !model.listConfig.filters.tag"
                  (click)="setListTo('ALL')"
                >
                  Global Feed
                </button>
              </li>
              @if (isLoggedIn()) {
                <li>
                  <button type="button" cdtTab [active]="model.listConfig.type === 'FEED'" (click)="setListTo('FEED')">
                    Your Feed
                  </button>
                </li>
              }
              <li [hidden]="!model.listConfig.filters.tag">
                <span cdtTab [active]="true">
                  <cdt-icon name="hash" />
                  <span class="visually-hidden">Tag</span>
                  {{ model.listConfig.filters.tag }}
                </span>
              </li>
            </ul>
          }
        </div>

        <!-- Live posts appear at the top of the list; screen readers hear them here. -->
        <p class="visually-hidden" aria-live="polite">{{ announcement() }}</p>

        <cdt-article-list></cdt-article-list>
      </div>

      <div class="col-md-3">
        <aside class="sidebar discord" aria-label="Discord">
          <cdt-discord-widget />
        </aside>
        @defer (when !!$tags().length) {
          <aside class="sidebar" aria-labelledby="popular-tags">
            <cdt-tags-list (setListTag)="setListTag($event)" [tags]="$tags()"></cdt-tags-list>
          </aside>
        }
      </div>
    </div>
  </div>
</div>
