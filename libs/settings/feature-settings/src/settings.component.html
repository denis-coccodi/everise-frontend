<div class="settings-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-6 offset-md-3 col-xs-12">
        <h1 class="text-xs-center">Your Settings</h1>
        <cdt-list-errors />
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <cdt-field>
            <input formControlName="image" type="text" id="image" placeholder="URL of profile picture" cdtInput="lg" />
          </cdt-field>
          <cdt-field required>
            <input formControlName="username" type="text" id="username" placeholder="Your Name" cdtInput="lg" />
            <cdt-input-errors [control]="form.controls.username" />
          </cdt-field>
          <cdt-field>
            <textarea cdtInput="lg" rows="5" id="bio" formControlName="bio" placeholder="Short bio about you">
            </textarea>
          </cdt-field>
          <cdt-field required>
            <input formControlName="email" type="email" id="email" placeholder="Email" cdtInput="lg" />
            <cdt-input-errors [control]="form.controls.email" />
          </cdt-field>
          <cdt-field required>
            <input formControlName="password" type="password" id="password" placeholder="New Password" cdtInput="lg" />
            <cdt-input-errors [control]="form.controls.password" />
          </cdt-field>
          <button
            data-testid="edit-button-container"
            cdtButton
            size="lg"
            [disabled]="form.invalid || form.pending"
            type="submit"
          >
            Update Settings
          </button>
        </form>
        <hr />
        <h4><cdt-checkbox [checked]="darkMode" (checkedChange)="toggleDarkMode()">Dark Mode</cdt-checkbox></h4>
        <hr />
        <button cdtButton="outline-danger" (click)="logout()">Or click here to logout.</button>
      </div>
    </div>
  </div>
</div>
