<cdt-dialog heading="Change password" (dismissed)="store.close()">
  <p class="what">
    The password of <strong>{{ email }}</strong
    >. Your other devices will be signed out; this one stays signed in.
  </p>
  <form [formRoot]="form">
    <!-- The same account, for password managers only (see the component): not a field to fill in. -->
    <input type="email" name="username" autocomplete="username" [value]="email" readonly hidden />
    <fieldset [disabled]="store.saving()">
      <cdt-field label="Current password" for="current-password" required>
        <input
          #firstField
          [formField]="form.currentPassword"
          type="password"
          id="current-password"
          autocomplete="current-password"
          cdtInput
        />
        <cdt-input-errors [field]="form.currentPassword" />
        <a class="forgot" routerLink="/forgot-password" [state]="forgotState">Forgot it?</a>
      </cdt-field>
      <cdt-field label="New password" for="new-password" required>
        <input
          [formField]="form.password"
          type="password"
          id="new-password"
          autocomplete="new-password"
          placeholder="At least 8 characters"
          cdtInput
        />
        <cdt-input-errors [field]="form.password" />
      </cdt-field>
      <cdt-field label="New password again" for="repeat-password" required>
        <input [formField]="form.repeat" type="password" id="repeat-password" autocomplete="new-password" cdtInput />
        <cdt-input-errors [field]="form.repeat" />
      </cdt-field>

      <cdt-message tone="error">{{ store.error() }}</cdt-message>

      <div class="actions">
        <button type="submit" cdtButton [disabled]="form().invalid()" [attr.aria-busy]="store.saving()">
          {{ store.saving() ? 'Saving…' : 'Change password' }}
        </button>
        <button type="button" cdtButton="secondary" (click)="store.close()">Cancel</button>
      </div>
    </fieldset>
  </form>
</cdt-dialog>
