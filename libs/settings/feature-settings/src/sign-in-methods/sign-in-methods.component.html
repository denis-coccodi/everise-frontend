@if (providers().length) {
  <h3 class="heading">Connected accounts</h3>
  <ul class="methods">
    @for (provider of providers(); track provider.id) {
      <li class="method">
        <img class="method-icon" [src]="provider.icon" alt="" width="20" height="20" />
        <span class="name">{{ provider.name }}</span>
        @if (provider.tied) {
          <span class="state tied">Tied to this account</span>
        } @else {
          <span class="state"
            >Not tied: sign out, then "Continue with {{ provider.name }}" with this account's email ties it.</span
          >
        }
      </li>
    }
  </ul>
}
