<div class="profile-page">
  <div class="user-info">
    <div class="container">
      <div class="row">
        <div class="col-xs-12 col-md-10 offset-md-1">
          <img [src]="$image()" class="user-img" />
          <h4 data-testid="article-author-profile" [hidden]="$profileLoading()">
            {{ $username() }}
          </h4>
          <p>{{ $bio() }}</p>
          <div class="profile-ctas">
            @if (!$isUser()) {
              <button
                [cdtButton]="$following() ? 'secondary' : 'outline-secondary'"
                size="sm"
                class="action-btn"
                (click)="toggleFollowing()"
              >
                <i class="ion-plus-round"></i>
                &nbsp; {{ $following() ? 'Unfollow' : 'Follow' }}
                {{ $username() }}
              </button>
            }
            <a
              [routerLink]="['/settings']"
              [hidden]="$isUser() === false"
              cdtButton="outline-secondary"
              size="sm"
              class="action-btn"
            >
              <i class="ion-gear-a"></i> Edit Profile Settings
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-xs-12 col-md-10 offset-md-1">
        <div class="articles-toggle">
          <ul cdtTabs>
            <li>
              <a
                cdtTab
                [routerLink]="['/profile', $username()]"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                >My Articles</a
              >
            </li>
            <li>
              <a
                cdtTab
                [routerLink]="['/profile', $username(), 'favorites']"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                >Favorited Articles</a
              >
            </li>
          </ul>
        </div>

        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
