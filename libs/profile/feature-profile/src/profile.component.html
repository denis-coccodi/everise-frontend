<div class="profile-page">
  <div class="user-info">
    <div class="container">
      <div class="row">
        <div class="col-xs-12 col-md-10 offset-md-1">
          <cdt-avatar class="user-img" [src]="$image()" [size]="100" frame="highlight" />
          <h1 class="name" data-testid="article-author-profile" [hidden]="$profileLoading()">
            {{ $username() }}
          </h1>
          <p>{{ $bio() }}</p>
          <div class="profile-ctas">
            @if (!$isUser()) {
              <button
                [cdtButton]="$following() ? 'secondary' : 'outline-secondary'"
                size="sm"
                class="action-btn"
                (click)="toggleFollowing()"
              >
                <cdt-icon name="plus" />
                &nbsp; {{ $following() ? 'Unfollow' : 'Follow' }}
                {{ $username() }}
              </button>
            }
            <a
              [routerLink]="['/settings']"
              [hidden]="$isUser() === false"
              cdtButton="outline-secondary"
              size="sm"
              class="action-btn"
            >
              <cdt-icon name="settings" /> Edit Profile Settings
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-xs-12 col-md-10 offset-md-1">
        <nav class="articles-toggle" aria-label="Articles">
          <ul cdtTabs>
            <li>
              <a
                cdtTab
                [routerLink]="['/profile', $id()]"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                >My Articles</a
              >
            </li>
            <li>
              <a
                cdtTab
                [routerLink]="['/profile', $id(), 'favorites']"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                >Favorited Articles</a
              >
            </li>
          </ul>
        </nav>

        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
