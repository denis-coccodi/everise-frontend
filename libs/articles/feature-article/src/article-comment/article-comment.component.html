<cdt-card>
  @if (comment().body) {
    <cdt-rich-text [text]="comment().body" [compact]="true" />
  }
  <cdt-media-grid [items]="media()" [compact]="true" />
  <div cdtCardFooter class="footer">
    <cdt-byline
      [image]="comment().author.image"
      [name]="comment().author.username"
      [date]="comment().createdAt"
      [link]="['/profile', comment().author.id]"
    />
    <span class="mod-options" [hidden]="currentUser().username !== comment().author.username">
      <button
        type="button"
        class="delete"
        aria-label="Delete comment"
        (click)="delete.emit({ commentId: comment().id, articleId: article().id })"
      >
        <cdt-icon name="trash" />
      </button>
    </span>
  </div>
</cdt-card>
