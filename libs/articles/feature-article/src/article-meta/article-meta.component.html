<div class="article-meta">
  <cdt-byline
    [image]="article().author.image"
    [name]="article().author.username"
    [date]="article().createdAt"
    [link]="['/profile', article().author.id]"
    avatarTestId="article-author"
  />

  <span [hidden]="!canModify()">
    <a cdtButton="outline-secondary" size="sm" [routerLink]="['/editor', article().id]">
      <cdt-icon name="edit" /> Edit Article
    </a>

    <button cdtButton="outline-danger" size="sm" (click)="deleteArticle()">
      <cdt-icon name="trash" /> Delete Article
    </button>
  </span>

  <span [hidden]="canModify()">
    <button
      [cdtButton]="article().author.following ? 'secondary' : 'outline-secondary'"
      size="sm"
      class="action-btn"
      (click)="toggleFollow()"
    >
      <cdt-icon name="plus" />
      &nbsp; {{ article().author.following ? 'Unfollow' : 'Follow' }}
      {{ article().author.username }}
    </button>
    &nbsp;&nbsp;
    <button [cdtButton]="article().favorited ? 'primary' : 'outline-primary'" size="sm" (click)="toggleFavorite()">
      <cdt-icon name="heart" />
      &nbsp; {{ article().favorited ? 'Unfavorite' : 'Favorite' }} Post
      <span class="counter">({{ article().favoritesCount }})</span>
    </button>
  </span>
</div>
