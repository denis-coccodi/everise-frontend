@if ($article(); as article) {
  <div class="article-page">
    <cdt-banner narrow>
      <h1 data-testid="article-title">{{ article.title }}</h1>
      <cdt-article-meta
        [article]="article"
        (follow)="follow($event)"
        (unfollow)="unfollow($event)"
        (favorite)="favorite($event)"
        (unfavorite)="unfavorite($event)"
        (delete)="delete($event)"
        [canModify]="$canModify()"
      >
      </cdt-article-meta>
    </cdt-banner>

    <div class="container page">
      <div class="row article-content">
        <div class="col-md-12">
          @if (article.roulette; as card) {
            <!-- A roulette result: the comment (or Tataru's remark) introduces it. -->
            <cdt-duty-card
              class="roulette-card"
              [type]="card.type"
              [name]="card.name"
              [detail]="card.detail"
              [mode]="card.mode"
              [image]="imageUrl(card.image)"
              [unknown]="card.dutyUnknown"
              [jobName]="card.job?.name"
              [jobIcon]="imageUrl(card.job?.icon)"
            />
          }
          <cdt-rich-text data-testid="article-body" [text]="article.body" />
        </div>
      </div>
      <hr />
      <div class="article-actions">
        <cdt-article-meta
          [article]="article"
          (follow)="follow($event)"
          (unfollow)="unfollow($event)"
          (favorite)="favorite($event)"
          (unfavorite)="unfavorite($event)"
          (delete)="delete($event)"
          [canModify]="$canModify()"
        ></cdt-article-meta>
      </div>

      <div class="row">
        <div class="col-xs-12 col-md-8 offset-md-2">
          @if ($isAuthenticated()) {
            <cdt-add-comment [article]="article" [currentUser]="$currentUser()" (submitComment)="submit($event)" />
          } @else {
            <a [routerLink]="['/login']">Sign in</a> or <a [routerLink]="['/register']">sign up</a> to add comments on
            this article.
          }

          @for (comment of $comments(); track comment.id) {
            <cdt-article-comment
              [currentUser]="$currentUser()"
              (delete)="deleteComment($event)"
              [article]="article"
              [comment]="comment"
            ></cdt-article-comment>
          }
        </div>
      </div>
    </div>
  </div>
}
