<cdt-list-errors> </cdt-list-errors>

<form [formGroup]="form" (ngSubmit)="submit()">
  <cdt-card [flush]="true">
    <cdt-field label="Comment" for="new-comment" hideLabel>
      <textarea
        id="new-comment"
        formControlName="comment"
        rows="5"
        placeholder="Write a comment..."
        cdtInput="lg"
      ></textarea>
      <cdt-input-errors [control]="form.controls.comment" />
    </cdt-field>
    <cdt-attachments-editor class="media-tools" [(items)]="attachments" [max]="1" />
    <div cdtCardFooter class="footer">
      <cdt-avatar [src]="currentUser().image" [size]="30" />
      <button cdtButton size="sm" type="submit">Post Comment</button>
    </div>
  </cdt-card>
</form>
