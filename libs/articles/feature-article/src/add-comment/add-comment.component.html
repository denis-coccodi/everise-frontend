<cdt-list-errors> </cdt-list-errors>

<form [formGroup]="form" (ngSubmit)="submitComment.emit(form.controls.comment.value)">
  <cdt-card [flush]="true">
    <cdt-field label="Comment" for="new-comment" hideLabel required>
      <textarea
        id="new-comment"
        formControlName="comment"
        rows="5"
        placeholder="Write a comment..."
        cdtInput="lg"
      ></textarea>
      <cdt-input-errors [control]="form.controls.comment" />
    </cdt-field>
    <div cdtCardFooter class="footer">
      <img [src]="currentUser().image" class="avatar" alt="" />
      <button cdtButton size="sm" type="submit">Post Comment</button>
    </div>
  </cdt-card>
</form>
