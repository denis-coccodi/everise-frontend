<div class="editor-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-10 offset-md-1 col-xs-12">
        <h1>{{ editing() ? 'Edit article' : 'New article' }}</h1>
        <cdt-list-errors></cdt-list-errors>
        <form [formRoot]="form">
          <cdt-field label="Title" for="title" required>
            <input
              id="title"
              [formField]="form.title"
              type="text"
              placeholder="Article Title"
              cdtInput="lg"
              data-testid="title-input"
            />
            <cdt-input-errors data-testid="title-input-error" [field]="form.title" />
          </cdt-field>
          <cdt-field label="Description" for="description" required>
            <input
              id="description"
              [formField]="form.description"
              type="text"
              placeholder="What's this article about?"
              cdtInput="lg"
              data-testid="description-input"
            />
            <cdt-input-errors data-testid="description-input-error" [field]="form.description" />
          </cdt-field>
          <cdt-field label="Text (Markdown)" for="body">
            <textarea
              id="body"
              [formField]="form.body"
              rows="5"
              type="text"
              placeholder="Write your post (Markdown)"
              cdtInput="lg"
              data-testid="body-textarea"
            ></textarea>
            <cdt-input-errors data-testid="body-textarea-error" [field]="form.body" />
          </cdt-field>
          <cdt-attachments-editor class="media-tools" [(items)]="attachments" [max]="maxAttachments" />
          <cdt-field label="Tags" for="tags">
            <input
              id="tags"
              [formField]="form.tagList"
              type="text"
              placeholder="Enter Tags"
              cdtInput="lg"
              data-testid="tags-textarea"
            />
          </cdt-field>

          @if (!editing() && discordAvailable()) {
            <cdt-checkbox class="share" [(checked)]="shareToDiscord">Also share in the Everise Discord</cdt-checkbox>
          }

          <button
            cdtButton
            size="lg"
            [disabled]="form().invalid() || form().pending()"
            type="submit"
            data-testid="publish-article-button"
          >
            Publish Article
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
