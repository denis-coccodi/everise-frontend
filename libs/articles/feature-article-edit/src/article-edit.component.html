<div class="editor-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-10 offset-md-1 col-xs-12">
        <h1>{{ editing() ? 'Edit article' : 'New article' }}</h1>
        <cdt-list-errors></cdt-list-errors>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <cdt-field label="Title" for="title" required>
            <input
              id="title"
              formControlName="title"
              type="text"
              placeholder="Article Title"
              cdtInput="lg"
              data-testid="title-input"
            />
            <cdt-input-errors data-testid="title-input-error" [control]="form.controls.title" />
          </cdt-field>
          <cdt-field label="Description" for="description" required>
            <input
              id="description"
              formControlName="description"
              type="text"
              placeholder="What's this article about?"
              cdtInput="lg"
              data-testid="description-input"
            />
            <cdt-input-errors data-testid="description-input-error" [control]="form.controls.description" />
          </cdt-field>
          <cdt-field label="Article (in Markdown)" for="body" required>
            <textarea
              id="body"
              formControlName="body"
              rows="5"
              type="text"
              placeholder="Write your post (Markdown). A YouTube link on its own line shows as the video."
              cdtInput="lg"
              data-testid="body-textarea"
            ></textarea>
            <cdt-input-errors data-testid="body-textarea-error" [control]="form.controls.body" />
          </cdt-field>
          <cdt-media-tools class="media-tools" for="body" />
          <cdt-field label="Tags" for="tags">
            <input
              id="tags"
              formControlName="tagList"
              type="text"
              placeholder="Enter Tags"
              cdtInput="lg"
              data-testid="tags-textarea"
            />
          </cdt-field>

          <button
            cdtButton
            size="lg"
            [disabled]="form.invalid || form.pending"
            type="submit"
            data-testid="publish-article-button"
          >
            Publish Article
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
