<div class="article-preview">
  <div class="article-meta">
    <cdt-byline
      [image]="article().author.image"
      [name]="article().author.username"
      [date]="article().createdAt"
      [link]="['/profile', article().author.id]"
    />
    <button
      [cdtButton]="article().favorited ? 'primary' : 'outline-primary'"
      size="sm"
      [attr.aria-pressed]="article().favorited"
      [attr.aria-label]="
        'Favorite, ' + article().favoritesCount + (article().favoritesCount === 1 ? ' favorite' : ' favorites')
      "
      (click)="toggleFavorite(article())"
    >
      <i class="ion-heart" aria-hidden="true"></i>
      {{ article().favoritesCount }}
    </button>
  </div>
  <a [routerLink]="['/article', article().id]" class="preview-link">
    @if (article().roulette; as card) {
      <!-- A roulette result: the comment (or Tataru's remark), then the result. -->
      @if (article().body) {
        <p class="top-line">{{ article().body }}</p>
      }
      <cdt-duty-card
        compact
        data-testid="article-list-title"
        [type]="card.type"
        [name]="card.name"
        [detail]="card.detail"
        [mode]="card.mode"
        [image]="imageUrl(card.image)"
        [unknown]="card.dutyUnknown"
        [jobName]="card.job?.name"
        [jobIcon]="imageUrl(card.job?.icon)"
      />
    } @else {
      <h2 data-testid="article-list-title">{{ article().title }}</h2>
      <p>{{ article().description }}</p>
    }
    <span class="read-more">Read more...</span>
    <ul class="tag-list" aria-label="Tags">
      @for (tag of article().tagList; track tag) {
        <li cdtTag="outline">
          {{ tag }}
        </li>
      }
    </ul>
  </a>
</div>
