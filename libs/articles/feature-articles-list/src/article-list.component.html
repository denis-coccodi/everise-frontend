@if (!$isLoading()) {
  @for (article of $articles(); track article.id) {
    <cdt-article-list-item
      data-testid="article-list"
      (unFavorite)="unFavorite($event)"
      (favorite)="favorite($event)"
      [article]="article"
      [class.live]="$liveIds().includes(article.id)"
    >
    </cdt-article-list-item>
  } @empty {
    <p class="empty">No articles are here... yet.</p>
  }

  <cdt-pager
    (setPage)="setPage($event)"
    [currentPage]="$listConfig.currentPage()"
    [totalPages]="$totalPages()"
  ></cdt-pager>
} @else {
  <p role="status">Loading articles...</p>
}
