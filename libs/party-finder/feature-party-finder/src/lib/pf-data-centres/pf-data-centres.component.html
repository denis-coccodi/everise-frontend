<nav aria-labelledby="pf-data-centres">
  <h2 id="pf-data-centres">Every region</h2>
  <ul>
    @for (option of store.physicalDataCentres(); track option.value) {
      <li>
        <a
          routerLink="/party-finder"
          [queryParams]="store.queryFor(option.value)"
          [attr.aria-current]="option.current ? 'page' : null"
          >{{ option.label }}</a
        >
      </li>
    }
  </ul>
</nav>
