<cdt-dialog [heading]="heading()" (dismissed)="store.close()">
  @if (store.sharing(); as sharing) {
    <!-- The listing as it'll be shared; in Discord, as a picture of this card. -->
    <cdt-pf-listing class="card" [listing]="sharing.listing" [icons]="sharing.icons" [now]="now" />

    <form (submit)="$event.preventDefault(); send()">
      <fieldset [disabled]="busy()">
        <cdt-field
          [label]="asPost() ? 'Your message for the feed' : 'Your message for the Discord'"
          for="pf-share-message"
        >
          <textarea
            #messageBox="cdtInput"
            id="pf-share-message"
            cdtInput
            rows="3"
            [attr.maxlength]="maxMessage"
            aria-describedby="pf-share-count"
            placeholder="Come join us! (optional)"
            [value]="message()"
            (input)="message.set(messageBox.value)"
          ></textarea>
          <span id="pf-share-count" class="count" aria-live="polite">{{ message().length }} / {{ maxMessage }}</span>
        </cdt-field>

        @if (asPost() && discordAvailable()) {
          <cdt-checkbox class="also" [(checked)]="alsoDiscord">Also share in the Everise Discord</cdt-checkbox>
        }

        <cdt-message tone="error">{{ store.error() }}</cdt-message>

        <div class="actions">
          <button type="submit" cdtButton [attr.aria-busy]="busy()">
            {{ busy() ? 'Sharing…' : asPost() ? 'Post' : 'Send to Discord' }}
          </button>
          <button type="button" cdtButton="secondary" (click)="store.close()">Cancel</button>
        </div>
      </fieldset>
    </form>
  }
</cdt-dialog>
