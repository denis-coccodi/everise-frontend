name: CI/CD

# Pushes to main build the app and deploy it to staging. Any other branch can be
# built and deployed to staging by hand: Actions → CI/CD → Run workflow → pick
# the branch. Pull requests only build.
# Production is deployed separately: see deploy-production.yaml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint and unit tests are not gated yet: they fail on main today
      # (sw-idb-cache.js lint error, zone.js missing for vitest).
      - run: npx nx run conduit:build --configuration=production

  deploy-staging:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Runs on pushes to main and on manual runs from any branch. There is one
    # staging Worker shared by all branches: the latest deploy wins. Deploys
    # run one at a time and are never cancelled halfway.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://conduit-web-staging.denis-coccodi.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx nx run conduit:build --configuration=production
      # Forwards /api to the staging backend Worker (conduit-staging), which must exist.
      - run: npx wrangler deploy --env staging --message "${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # App shell, SPA fallback, and register + cookie auth through the /api proxy.
      - name: Smoke test staging
        run: sh scripts/smoke.sh create https://conduit-web-staging.denis-coccodi.workers.dev "$RUNNER_TEMP/jar.txt"
      - name: Summary
        run: |
          {
            echo "Staging is live at https://conduit-web-staging.denis-coccodi.workers.dev with \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`."
            echo
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "To ship this commit to production, open [Deploy production](${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-production.yaml) and click **Run workflow**."
            else
              echo "Production only deploys from \`main\`: merge this branch first."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
