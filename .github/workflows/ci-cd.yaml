name: CI/CD

# Pushes to main build the app and deploy it to staging. Any other branch can be
# built and deployed to staging by hand: Actions → CI/CD → Run workflow → pick
# the branch. Pull requests only build.
# Production is deployed separately: see deploy-production.yaml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t lint test
      - run: npx nx run everise:build --configuration=production
      - run: npx nx run everise:build --configuration=staging

  deploy-staging:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Runs on pushes to main and on manual runs from any branch. There is one
    # staging Worker shared by all branches: the latest deploy wins. Deploys
    # run one at a time and are never cancelled halfway.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://staging.everise.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx nx run everise:build --configuration=staging
      # The build calls the staging backend (environment.staging.ts).
      - run: npx wrangler deploy --env staging --message "${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # App shell, SPA fallback, avatar, /api in the bundle, /api through the service binding, register + cookie auth.
      - name: Smoke test staging
        run: sh scripts/smoke.sh create https://staging.everise.dev "$RUNNER_TEMP/jar.txt"
        # Both staging Workers are behind Cloudflare Access; this service token
        # lets CI through. While the secrets are unset, no Access headers are sent.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Summary
        run: |
          {
            echo "Staging is live at https://staging.everise.dev with \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`."
            echo
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "To ship this commit to production, open [Deploy production](${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-production.yaml) and click **Run workflow**."
            else
              echo "Production only deploys from \`main\`: merge this branch first."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
