<!-- The first stop for the keyboard: jumps past the navigation (WCAG 2.4.1). -->
<a class="skip-link" href="#main" (click)="skipToMain($event)">Skip to main content</a>
<cdt-navbar [isLoggedIn]="authStore.loggedIn()" [user]="authStore.user()" (logout)="authStore.logout()"></cdt-navbar>
<main id="main" #main tabindex="-1">
  <router-outlet></router-outlet>
</main>

@defer (on idle) {
  <cdt-footer></cdt-footer>
}
