<nav class="navbar navbar-light">
  <div class="container">
    <a class="navbar-brand" routerLink="/">everise</a>

    @if (!isLoggedIn()) {
      <ul class="nav navbar-nav pull-xs-right">
        <li class="nav-item">
          <a class="nav-link" routerLink="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/roulette" routerLinkActive="active">
            <i class="ion-shuffle"></i>&nbsp;Roulette
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/login" routerLinkActive="active">Sign in</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/register" routerLinkActive="active">Sign up</a>
        </li>
      </ul>
    } @else {
      <ul class="nav navbar-nav pull-xs-right">
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
            >Home</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/roulette" routerLinkActive="active">
            <i class="ion-shuffle"></i>&nbsp;Roulette
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/editor" routerLinkActive="active">
            <i class="ion-compose"></i>&nbsp;New Post
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/settings" routerLinkActive="active">
            <i class="ion-gear-a"></i>&nbsp;Settings
          </a>
        </li>
        <li class="nav-item">
          <a
            data-testid="loggedin-user"
            class="nav-link"
            [routerLink]="['/profile', user().username]"
            routerLinkActive="active"
          >
            {{ user().username }}
          </a>
        </li>
      </ul>
    }
  </div>
</nav>
