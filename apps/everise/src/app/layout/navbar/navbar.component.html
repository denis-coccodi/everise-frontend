<nav class="navbar" aria-label="Main">
  <div class="container">
    <a class="navbar-brand" routerLink="/" aria-label="Everise, home"
      ><img class="crest" src="assets/images/everise-crest.png" alt="" width="32" height="32" />everise</a
    >

    <!-- On a phone the links fold into this button's panel. The pages have an
         icon each; the account's links (sign in, sign up, profile, settings)
         are words only. -->
    <button
      #toggle
      type="button"
      class="menu-toggle"
      aria-controls="site-menu"
      [attr.aria-expanded]="open()"
      (click)="toggleMenu()"
    >
      <cdt-icon class="menu-icon" [name]="open() ? 'close' : 'menu'" />
      Menu
    </button>

    <div id="site-menu" class="menu" [class.open]="open()">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active" ariaCurrentWhenActive="page">
            <cdt-icon name="home" />Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/roulette" routerLinkActive="active" ariaCurrentWhenActive="page">
            <cdt-icon name="shuffle" />Roulette
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/party-finder" routerLinkActive="active" ariaCurrentWhenActive="page">
            <cdt-icon name="party" />Party Finder
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/waking-sands" routerLinkActive="active" ariaCurrentWhenActive="page">
            <cdt-icon name="chat" />The Waking Sands
          </a>
        </li>
        @if (!isLoggedIn()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Sign in</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page"
              >Sign up</a
            >
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/editor" routerLinkActive="active" ariaCurrentWhenActive="page">
              <cdt-icon name="compose" />New Post
            </a>
          </li>
          <!-- The account menu: the user's own pages and signing out. -->
          <li class="nav-item wide-only">
            <cdt-menu label="Account">
              <span cdtMenuTrigger class="account" data-testid="loggedin-user">
                <cdt-avatar [src]="user().image" [size]="28" />
                {{ user().username }}
              </span>
              <a cdtMenuItem [routerLink]="['/profile', user().id]">Your profile</a>
              <a cdtMenuItem routerLink="/settings">Settings</a>
              <button cdtMenuItem type="button" [divided]="true" (click)="logout.emit()">Sign out</button>
            </cdt-menu>
          </li>
          <!-- In the phone panel the same links, folded under the user's name
               (a disclosure that starts closed each time the panel opens). -->
          <li class="nav-item narrow-only">
            <button
              type="button"
              class="account-heading"
              aria-controls="account-links"
              [attr.aria-expanded]="accountOpen()"
              (click)="accountOpen.set(!accountOpen())"
            >
              <cdt-avatar [src]="user().image" [size]="28" />
              <span class="name">{{ user().username }}</span>
              <cdt-icon class="chevron" name="chevron-right" />
            </button>
            <ul id="account-links" class="account-links" [hidden]="!accountOpen()">
              <li class="nav-item">
                <a
                  class="nav-link"
                  [routerLink]="['/profile', user().id]"
                  routerLinkActive="active"
                  ariaCurrentWhenActive="page"
                  >Your profile</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page"
                  >Settings</a
                >
              </li>
              <li class="nav-item">
                <button type="button" class="nav-link sign-out" (click)="logout.emit()">Sign out</button>
              </li>
            </ul>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
