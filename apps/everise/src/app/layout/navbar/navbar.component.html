<nav class="navbar" aria-label="Main">
  <div class="container">
    <a class="navbar-brand" routerLink="/" aria-label="Everise, home"
      ><img class="crest" src="assets/images/everise-crest.png" alt="" width="32" height="32" />everise</a
    >

    <!-- On a phone, at the bar's end: the bell, then the Menu button whose
         panel holds the links. The pages have an icon each; the account's
         links (sign in, sign up, profile, settings) are words only. -->
    <div class="bar-actions narrow-only">
      @if (isLoggedIn()) {
        <cdt-notifications />
      }
      <button
        #toggle
        type="button"
        class="menu-toggle"
        aria-controls="site-menu"
        [attr.aria-expanded]="open()"
        (click)="toggleMenu()"
      >
        <cdt-icon class="menu-icon" [name]="open() ? 'close' : 'menu'" />
        Menu
      </button>
    </div>

    <div id="site-menu" class="menu" [class.open]="open()">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
          >
            <cdt-icon name="home" />Home
          </a>
        </li>
        <!-- The other pages, by group (nav-groups.ts): a menu each in the
             bar, the group's name over its links in the phone panel. -->
        @for (group of groups; track group.label) {
          <li class="nav-item wide-only"><cdt-nav-group [group]="group" /></li>
          <li class="nav-item narrow-only"><cdt-nav-group [group]="group" variant="list" /></li>
        }
        @if (!isLoggedIn()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Sign in</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page"
              >Sign up</a
            >
          </li>
        } @else {
          <!-- The notifications, before the account (on a phone, before Menu instead). -->
          <li class="nav-item wide-only">
            <cdt-notifications />
          </li>
          <!-- The account: a menu in the bar; in the phone panel, folded under the name. -->
          <li class="nav-item wide-only"><cdt-account-nav [user]="user()" (logout)="logout.emit()" /></li>
          <li class="nav-item narrow-only">
            <cdt-account-nav #phoneAccount [user]="user()" variant="list" (logout)="logout.emit()" />
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
