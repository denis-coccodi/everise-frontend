<nav class="navbar navbar-light" aria-label="Main">
  <div class="container">
    <a class="navbar-brand" routerLink="/" aria-label="Everise, home"
      ><img class="crest" src="assets/images/everise-crest.png" alt="" width="32" height="32" />everise</a
    >

    <!-- On a phone the links fold into this button's panel. -->
    <button
      #toggle
      type="button"
      class="menu-toggle"
      aria-controls="site-menu"
      [attr.aria-expanded]="open()"
      (click)="open.set(!open())"
    >
      <cdt-icon class="menu-icon" [name]="open() ? 'close' : 'menu'" />
      Menu
    </button>

    <div id="site-menu" class="menu" [class.open]="open()">
      <ul class="nav navbar-nav">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active" ariaCurrentWhenActive="page">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/roulette" routerLinkActive="active" ariaCurrentWhenActive="page">
            <cdt-icon name="shuffle" />&nbsp;Roulette
          </a>
        </li>
        @if (!isLoggedIn()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Sign in</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page"
              >Sign up</a
            >
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/editor" routerLinkActive="active" ariaCurrentWhenActive="page">
              <cdt-icon name="compose" />&nbsp;New Post
            </a>
          </li>
          <!-- The account menu: the user's own pages and signing out. -->
          <li class="nav-item wide-only">
            <cdt-menu label="Account">
              <span cdtMenuTrigger class="account" data-testid="loggedin-user">
                <img class="avatar" [src]="user().image" alt="" width="28" height="28" />
                {{ user().username }}
              </span>
              <a cdtMenuItem [routerLink]="['/profile', user().id]">Your profile</a>
              <a cdtMenuItem routerLink="/settings">Settings</a>
              <button cdtMenuItem type="button" [divided]="true" (click)="logout.emit()">Sign out</button>
            </cdt-menu>
          </li>
          <!-- In the phone panel the same, laid out flat under the user's name. -->
          <li class="nav-item narrow-only account-heading">
            <img class="avatar" [src]="user().image" alt="" width="28" height="28" />
            <span class="name">{{ user().username }}</span>
          </li>
          <li class="nav-item narrow-only">
            <a
              class="nav-link"
              [routerLink]="['/profile', user().id]"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              >Your profile</a
            >
          </li>
          <li class="nav-item narrow-only">
            <a class="nav-link" routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page"
              >Settings</a
            >
          </li>
          <li class="nav-item narrow-only">
            <button type="button" class="nav-link sign-out" (click)="logout.emit()">Sign out</button>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
