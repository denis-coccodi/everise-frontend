<html lang="en">
  <head>

    <title>Everise</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The crest of Everise, the free company on Odin, drawn from the

    <link rel="icon" type="image/png" sizes="128x128" href="assets/images/everise-crest.png" />

    <!-- The card a link to the site shows in Discord and elsewhere; a post's
         page gets its own (worker/index.ts). The crest's orange is the card's line. -->
    <meta name="description" content="A laid-back, friendly free company. Everyone is welcome." />
    <meta property="og:site_name" content="Everise" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Everise" />

    <meta property="og:image" content="https://everise.dev/assets/images/everise-crest.png" />

    <meta name="theme-color" content="#f78627" />
