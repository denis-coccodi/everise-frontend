# The documentation GitHub Pages builds from this folder. It's served at
# everise.dev, not github.io (worker/docs.ts): the technical pages at
# /docs/frontend/ (this baseurl), the site guide (_guide) at /guide/.
# How it all fits together: the docs-site skill.
title: Frontend docs
description: How the Everise frontend is built - architecture, theme, accessibility and deployment.
baseurl: /docs/frontend
repository_name: everise-frontend
section: frontend
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
collections:
  guide:
    output: true
    permalink: /guide/:path/
defaults:
  - scope:
      path: ''
    values:
      layout: docs
  - scope:
      path: ''
      type: guide
    values:
      layout: guide
