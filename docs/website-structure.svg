<rect x="760" y="98" width="760" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="778" y="129" font-size="20" font-weight="700" fill="#5cb85c">conduit</text>
<text x="1386.8" y="120" font-size="13" font-weight="400" fill="#475569">◉ username</text>
<text x="1386.8" y="136" font-size="10.5" font-weight="400" fill="#c2410c" font-family="Consolas, SFMono-Regular, Menlo, monospace" xml:space="preserve">/profile/:username</text>
