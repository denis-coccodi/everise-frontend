<text x="1112.1999999999998" y="120" font-size="13" font-weight="600" fill="#1e293b">Home</text>
<text x="1112.1999999999998" y="136" font-size="10.5" font-weight="400" fill="#059669" font-family="Consolas, SFMono-Regular, Menlo, monospace" xml:space="preserve">/home</text>
<text x="70" y="172" font-size="11.5" font-weight="400" fill="#64748b" font-style="italic">Footer on every page: conduit logo → /</text>
<rect x="630" y="192" width="300" height="62" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="780" y="217" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="Consolas, SFMono-Regular, Menlo, monospace" xml:space="preserve">/  → redirects to /home</text>
<text x="780" y="238" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" font-family="Consolas, SFMono-Regular, Menlo, monospace" xml:space="preserve">unknown paths (**) → /home</text>
<rect x="40" y="300" width="470" height="528" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="56" y="324" font-size="11.5" font-weight="700" fill="#64748b">PUBLIC — anyone can open</text>
<rect x="540" y="300" width="980" height="528" rx="14" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="556" y="324" font-size="11.5" font-weight="700" fill="#7c3aed">SIGNED IN ONLY — AuthGuard sends signed-out visitors to /login</text>
