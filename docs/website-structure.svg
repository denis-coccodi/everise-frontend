<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
</defs>
<rect width="1560" height="1056" fill="#ffffff"/>
<text x="40" y="38" font-size="22" font-weight="700" fill="#1e293b">Conduit website — pages and navigation</text>
<text x="40" y="60" font-size="13" font-weight="400" fill="#475569">Every route of the Angular app, what the page shows and where it leads. Page colours match the feature library that implements it.</text>
<text x="70" y="90" font-size="11" font-weight="700" fill="#64748b">NAVBAR · SIGNED OUT</text>
<rect x="70" y="98" width="640" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="88" y="129" font-size="20" font-weight="700" fill="#5cb85c">conduit</text>
<text x="634.4" y="120" font-size="13" font-weight="400" fill="#475569">Sign up</text>
<text x="634.4" y="136" font-size="10.5" font-weight="400" fill="#7c3aed" font-family="Consolas, SFMono-Regular, Menlo, monospace" xml:space="preserve">/register</text>
<text x="548.6" y="120" font-size="13" font-weight="400" fill="#475569">Sign in</text>
<text x="548.6" y="136" font-size="10.5" font-weight="400" fill="#7c3aed" font-family="Consolas, SFMono-Regular, Menlo, monospace" xml:space="preserve">/login</text>
